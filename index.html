<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070513">
<meta name="mobile-web-app-capable" content="yes">
<title>👑 KronAI — MLBB AI Coach</title>
<style>
:root{
  --bg:#070513;--panel:#0d0a1b;--panel2:#141027;--panel3:#1a1532;
  --line:#292049;--text:#f3efff;--muted:#9088aa;
  --purple:#9a7bff;--blue:#57b9ff;--cyan:#59e1ff;--pink:#ff5caa;
  --green:#4ee5ad;--red:#ff6684;--gold:#ffd75a;
  --shadow:0 18px 50px rgba(0,0,0,.35);
  font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  background:
   radial-gradient(circle at 80% -10%,rgba(76,70,210,.24),transparent 35%),
   radial-gradient(circle at -10% 35%,rgba(30,146,255,.11),transparent 33%),
   var(--bg);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#32275b;border-radius:20px}
.hidden{display:none!important}

.app{min-height:100vh;padding-bottom:92px}
.top{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:10px;
  padding:11px 13px;
  background:rgba(7,5,19,.82);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(143,117,255,.12);
}
.logo{display:flex;align-items:center;gap:9px;min-width:145px}
.logoMark{
  width:39px;height:39px;display:grid;place-items:center;
  background:linear-gradient(145deg,#9c6cff,#3d63ff);
  clip-path:polygon(24% 0,76% 0,100% 50%,76% 100%,24% 100%,0 50%);
  font-weight:900;color:#fff;box-shadow:0 0 26px rgba(144,103,255,.5)
}
.logoTitle{font-weight:900;letter-spacing:.4px;font-size:16px}
.logoSub{font-size:8px;color:#9186ad;letter-spacing:2px;margin-top:1px}
.search{
  flex:1;max-width:520px;margin-left:auto;
  background:#120e22;border:1px solid var(--line);border-radius:12px;
  display:flex;align-items:center;padding:8px 11px;gap:8px
}
.search input{width:100%;border:0;outline:0;background:transparent;font-size:14px}
.status{
  display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);
  border-radius:999px;background:#120e22;color:#bbb3d2;font-size:10px;white-space:nowrap
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.iconBtn{
  width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:#120e22
}

.heroBanner{
  max-width:1360px;margin:14px auto 0;padding:20px 14px 8px;
}
.heroBannerInner{
  position:relative;overflow:hidden;min-height:230px;border:1px solid #28204a;
  border-radius:24px;padding:26px 24px;
  background:
    radial-gradient(circle at 73% 35%,rgba(50,80,255,.28),transparent 30%),
    radial-gradient(circle at 78% 90%,rgba(127,44,255,.22),transparent 26%),
    linear-gradient(135deg,#0b0818,#0d0b22 55%,#080713);
}
.heroGlow{position:absolute;right:5%;top:-30%;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(57,118,255,.15),transparent 65%);pointer-events:none}
.heroCopy{position:relative;z-index:2;max-width:560px}
.kicker{font-size:10px;color:#a99ddd;letter-spacing:2px;font-weight:800;text-transform:uppercase}
.heroCopy h1{margin:10px 0 8px;font-size:clamp(28px,6vw,48px);line-height:1.03}
.heroCopy h1 span{background:linear-gradient(90deg,#fff,#9b82ff,#58bfff);-webkit-background-clip:text;background-clip:text;color:transparent}
.heroCopy p{margin:0;color:#9891ad;font-size:13px;line-height:1.6}
.heroActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{
  border:1px solid var(--line);background:#15102a;padding:11px 15px;border-radius:12px;font-weight:800;font-size:12px
}
.btn.primary{background:linear-gradient(135deg,#8b5cff,#4b71ff);border-color:transparent;box-shadow:0 8px 28px rgba(105,74,255,.28)}
.btn.pink{background:linear-gradient(135deg,#fd4f91,#6e4bff);border-color:transparent}
.heroArt{
  position:absolute;right:3%;bottom:-4%;width:min(42%,500px);height:90%;
  border-radius:50%;
  background:
    radial-gradient(circle at 53% 38%,rgba(133,98,255,.38),transparent 10%),
    radial-gradient(circle at 55% 48%,rgba(64,112,255,.24),transparent 28%),
    radial-gradient(circle at 50% 55%,rgba(70,34,150,.18),transparent 50%);
  filter:blur(.2px);
}
.heroArt:before{
  content:"K";position:absolute;inset:15% 28%;display:grid;place-items:center;
  color:rgba(116,95,255,.55);font-size:130px;font-weight:1000;
  text-shadow:0 0 40px rgba(85,78,255,.65)
}
.heroArt:after{
  content:"PLAY • LEARN • IMPROVE";position:absolute;right:2%;top:42%;
  transform:rotate(-13deg);color:#805cff;font-size:13px;font-weight:1000;letter-spacing:1px
}

.quickGrid{
  max-width:1360px;margin:8px auto 0;padding:0 14px;
  display:grid;grid-template-columns:repeat(6,1fr);gap:10px
}
.quickCard{
  min-height:96px;border:1px solid var(--line);border-radius:16px;padding:15px;
  background:linear-gradient(145deg,#110d21,#0b0a15);text-align:left;position:relative;overflow:hidden
}
.quickCard:hover{border-color:#4d3a82}
.quickIcon{font-size:23px}
.quickCard b{display:block;font-size:13px;margin-top:9px}
.quickCard span{display:block;color:var(--muted);font-size:10px;line-height:1.35;margin-top:3px}
.quickCard .arrow{position:absolute;right:12px;top:13px;color:#9d81ff}

.wrap{max-width:1360px;margin:0 auto;padding:12px 14px 0}
.section{margin-top:22px}
.sectionHead{display:flex;align-items:end;gap:9px;margin-bottom:11px}
.sectionHead h2{margin:0;font-size:19px}
.sectionHead p{margin:0;color:var(--muted);font-size:11px}
.spacer{flex:1}
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.pill{white-space:nowrap;border:1px solid var(--line);background:#0f0b1d;color:var(--muted);padding:9px 12px;border-radius:10px;font-size:11px;font-weight:700}
.pill.on{background:linear-gradient(135deg,#9a6dff,#5f86ff);border-color:transparent;color:#fff}

.statsRow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
.statBox{border:1px solid var(--line);border-radius:13px;background:#0f0b1d;padding:13px}
.statBox strong{display:block;font-size:19px}
.statBox span{font-size:10px;color:var(--muted)}

.tier{margin-bottom:19px}
.tierHead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.tierBadge{width:38px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:1000;font-size:12px;border:1px solid}
.tierDesc{font-size:11px;color:var(--muted)}
.heroGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}
.heroCard{
  border:1px solid var(--line);border-radius:14px;padding:10px;background:linear-gradient(160deg,#100c1f,#0b0913);
  text-align:left;transition:.18s transform,.18s border-color;position:relative
}
.heroCard:hover{transform:translateY(-2px);border-color:#4f3b84}
.heroTop{display:flex;gap:10px;align-items:center}
.portrait{
  width:50px;height:50px;flex:0 0 50px;border-radius:12px;display:grid;place-items:center;
  font-weight:1000;font-size:16px;color:#fff;border:1px solid rgba(255,255,255,.12);
  background:
    radial-gradient(circle at 35% 25%,rgba(255,255,255,.16),transparent 25%),
    linear-gradient(145deg,var(--pc,#7555ff),#0d0b19 72%);
  box-shadow:inset 0 0 22px rgba(0,0,0,.35)
}
.heroName{font-weight:850;font-size:12px;line-height:1.2}
.heroRole{color:var(--muted);font-size:9px;margin-top:3px}
.heroMeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px}
.tierMini{font-size:9px;padding:3px 7px;border-radius:999px;font-weight:900;border:1px solid}
.smallStat{font-size:9px;color:var(--muted)}
.smallStat b{color:#e8e2fa}
.cardHint{font-size:9px;color:#786d94;margin-top:8px}

.modalBack{position:fixed;inset:0;background:rgba(4,2,12,.79);backdrop-filter:blur(7px);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.modal{
  width:100%;max-width:780px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#100c20,#080710);
  border:1px solid #33265e;border-radius:22px 22px 0 0;padding:18px;box-shadow:var(--shadow)
}
@media(min-width:800px){.modalBack{align-items:center;padding:20px}.modal{border-radius:22px}}
.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#171129}
.profile{display:flex;gap:15px;align-items:center;padding-right:42px}
.profile .portrait{width:84px;height:84px;flex-basis:84px;border-radius:18px;font-size:27px}
.profile h2{margin:0 0 4px;font-size:25px}
.sub{color:var(--muted);font-size:11px}
.profileStats{display:flex;gap:14px;margin-top:9px}
.profileStats span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:1px}
.profileStats b{font-size:14px}
.tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);margin:17px 0 13px}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);font-size:11px;font-weight:900;white-space:nowrap}
.tab.on{color:#a78cff;border-color:#a78cff}
.panel{border:1px solid var(--line);border-radius:13px;background:#100d1f;padding:14px}
.skill{border:1px solid var(--line);background:#141027;border-radius:11px;padding:11px;margin-top:8px}
.skill b{font-size:12px}
.skill p{margin:4px 0 0;color:#aaa0c2;font-size:11px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 10px;border-radius:9px;background:#141027;border:1px solid var(--line);font-size:10px}
.tips{margin-top:9px;color:#aaa0c2;font-size:11px;line-height:1.55}

.draftWrap{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.team{border:1px solid var(--line);border-radius:16px;background:#0f0b1d;padding:13px}
.team.enemy{border-color:#4b1d36}
.team h3{margin:0 0 10px;font-size:13px}
.team h3 span{color:var(--muted);font-size:10px;font-weight:500}
.bans{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.slot{
  min-height:49px;border:1px dashed var(--line);border-radius:11px;background:#141027;
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--muted);padding:5px
}
.slot.pick{justify-content:flex-start;text-align:left;gap:8px;padding:7px}
.slot.pick .portrait{width:34px;height:34px;flex-basis:34px;border-radius:9px;font-size:12px}
.pickList{display:grid;gap:7px}
.slot.selected{border-color:#8e6dff;box-shadow:0 0 0 1px rgba(142,109,255,.15) inset}
.slot.filled{border-style:solid;color:#fff}
.slot small{display:block;color:var(--muted);font-size:8px;text-transform:uppercase}

.analysis{margin-top:12px;border:1px solid #33265e;background:linear-gradient(145deg,#14102a,#0c0a17);border-radius:16px;padding:14px}
.analysis b{font-size:13px}
.recommend{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.rec{min-width:130px;border:1px solid var(--line);border-radius:12px;background:#100d1f;padding:10px}
.recTop{display:flex;gap:8px;align-items:center}
.rec .portrait{width:38px;height:38px;flex-basis:38px;border-radius:9px;font-size:12px}
.rec b{font-size:10px}
.rec span{display:block;color:var(--muted);font-size:8px;margin-top:4px;line-height:1.3}

.coachCard{border:1px solid #30235b;border-radius:18px;background:
 radial-gradient(circle at 80% 30%,rgba(109,81,255,.22),transparent 30%),
 linear-gradient(145deg,#110c23,#0b0915);padding:15px}
.coachHead{display:flex;gap:12px;align-items:center}
.bot{
 width:47px;height:47px;border-radius:15px;display:grid;place-items:center;font-size:23px;
 background:linear-gradient(145deg,#7c4dff,#385fff);box-shadow:0 0 22px rgba(104,75,255,.35)
}
.chat{height:250px;overflow:auto;margin-top:12px;padding:3px}
.msg{display:flex;margin:8px 0}
.msg.user{justify-content:flex-end}
.bubble{max-width:85%;padding:10px 12px;border-radius:14px;font-size:11px;line-height:1.5}
.msg.ai .bubble{background:#17122b;border:1px solid var(--line)}
.msg.user .bubble{background:linear-gradient(135deg,#6d4bf6,#4c70f3)}
.chatInput{display:flex;gap:8px;margin-top:10px}
.chatInput input{flex:1;border:1px solid var(--line);background:#100d1f;border-radius:12px;padding:11px 12px;outline:0}
.send{min-width:76px;border:0;border-radius:12px;background:linear-gradient(135deg,#8a58ff,#5376ff);font-weight:900}

.footer{text-align:center;color:#625a79;font-size:9px;padding:28px 15px}
.bottom{
 position:fixed;left:0;right:0;bottom:0;z-index:60;
 display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:9px 9px calc(9px + env(safe-area-inset-bottom));
 background:rgba(8,6,18,.94);backdrop-filter:blur(18px);border-top:1px solid #201938
}
.bottom button{border:0;background:transparent;color:#716887;padding:6px 2px;font-size:9px;font-weight:800}
.bottom button .bi{font-size:20px;display:block;margin-bottom:3px}
.bottom button.on{color:#aa8aff}
.drawerBack{position:fixed;inset:0;z-index:100;background:rgba(3,2,8,.74);backdrop-filter:blur(6px)}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(90%,390px);background:#0b0814;border-left:1px solid #302550;padding:15px;overflow:auto}
.drawer h2{margin:6px 0}
.menuItem{display:block;width:100%;text-align:left;background:#120e22;border:1px solid var(--line);padding:13px;border-radius:12px;margin-top:8px;font-size:12px;font-weight:800}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);z-index:120;background:#1b1431;border:1px solid #49377d;padding:10px 13px;border-radius:12px;font-size:11px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.easter{position:fixed;inset:0;z-index:200;background:radial-gradient(circle,#1b0a36,#05030a 65%);display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}
.easterBox{max-width:520px}
.easterBox .big{font-size:72px}
.easterBox h2{font-size:32px;margin:4px 0}
.easterBox p{color:#9f94b7;line-height:1.6;font-size:12px}

@media(max-width:1000px){
 .quickGrid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:760px){
 .search{display:none}
 .logo{min-width:0}
 .status{margin-left:auto}
 .heroBannerInner{min-height:270px}
 .heroArt{width:58%;right:-12%;opacity:.75}
 .quickGrid{grid-template-columns:repeat(2,1fr)}
 .statsRow{grid-template-columns:repeat(2,1fr)}
 .draftWrap{grid-template-columns:1fr}
}
@media(max-width:420px){
 .quickGrid{grid-template-columns:1fr 1fr}
 .heroGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .heroCard{padding:9px}
 .portrait{width:44px;height:44px;flex-basis:44px}
 .heroName{font-size:11px}
 .heroBannerInner{padding:22px 18px}
}
</style>
</head>

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h)}
function stats(name,tier){
 const b=TIER_BASE[tier],h=hash(name);
 return {
  winRate:+(b.win+((h%31)-15)/10).toFixed(1),
  pickRate:+Math.max(.1,b.pick+(((h>>3)%27)-13)/10).toFixed(2),
  banRate:+Math.max(.1,b.ban+(((h>>6)%27)-13)/10).toFixed(2)
 };
}
function primaryRole(role){return role.split(",")[0].trim()}
function heroObj(x){
 const [name,roles,tier]=x;
 const role=primaryRole(roles);
 const s=stats(name,tier);
 return {name,roles,tier,lane:laneMap[name]||[],role,stats:s};
}

function initial(name){
 const words=name.replace(/\./g,"").split(" ").filter(Boolean);
 return words.length===1?words[0].slice(0,2).toUpperCase():(words[0][0]+words[1][0]).toUpperCase();
}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function portrait(h,sizeClass=""){
 const c=ROLE_COLORS[h.role]||"#8b6cff";
 return `<div class="portrait ${sizeClass}" style="--pc:${c}" title="${esc(h.name)}">${initial(h.name)}</div>`;
}

function recommendDraft(){
 const used=allSelected();

 const enemyRoles=enemyPicks.filter(Boolean).map(n=>byName[n].role);
 if(enemyPicks.some(Boolean)){
  pool=pool.map(h=>{
   let score=TIERS.length-TIERS.indexOf(h.tier);
   if(enemyRoles.includes("Assassin")&&["Tank","Support"].includes(h.role))score+=4;
   if(enemyRoles.includes("Tank")&&["Mage","Marksman"].includes(h.role))score+=3;
   if(myPicks.some(n=>n&&((curatedSynergy[n]||[]).includes(h.name))))score+=4;
   return {h,score};
  }).sort((a,b)=>b.score-a.score).map(x=>x.h);
 }else{
  pool.sort((a,b)=>TIERS.indexOf(a.tier)-TIERS.indexOf(b.tier));
 }
 return pool.slice(0,5);
}

function matchup(){
 const a=byName[matchA]||heroes[0],b=byName[matchB]||heroes[1];
 const verdict=matchScore(a,b);
 return `<div class="wrap">
  <div class="sectionHead" style="margin-top:8px"><div><h2>Counter Lab</h2><p>Quick 1v1 matchup prototype.</p></div></div>
  <div class="panel">
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    ${selectHeroBox("matchA",a)}
    ${selectHeroBox("matchB",b)}
   </div>
   <div style="margin-top:12px;padding:13px;border-radius:12px;background:#0d0a18;border:1px solid var(--line)">
    <b style="color:${verdict.color}">${verdict.title}</b>
    <div class="tips">${verdict.text}</div>
   </div>
  </div>
 </div>`;
}
function selectHeroBox(id,h){
 return `<label style="font-size:10px;color:var(--muted);display:block">Hero</label><select id="${id}" style="margin-top:5px;width:100%;background:#141027;border:1px solid var(--line);border-radius:10px;padding:11px;color:#fff">${heroes.map(x=>`<option ${x.name===h.name?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`;
}
function matchScore(a,b){
 const counters=(curatedCounters[b.name]||[]).includes(a.name);
 const reverse=(curatedCounters[a.name]||[]).includes(b.name);
 if(counters)return{title:`${a.name} has the edge`,color:"#58e0ad",text:`This prototype marks ${a.name} as a direct answer to ${b.name}. Play around ${a.name}'s strong timing rather than forcing blind fights.`};
 if(reverse)return{title:`${b.name} has the edge`,color:"#ff8ba5",text:`This prototype marks ${b.name} as a direct answer to ${a.name}. Consider a different pick or change your build and engage timing.`};
 if(a.tier==="S+"||a.tier==="S")return{title:`Slight edge: ${a.name}`,color:"#bca3ff",text:`No curated hard-counter exists here. The higher-tier hero gets a small prototype advantage; lane, player skill and draft context still matter.`};
 return{title:"Skill / matchup dependent",color:"#ffd76a",text:"No strong curated matchup signal yet. Add more patch-specific matchup data to make this panel reliable."};
}

/* -------------------- COACH -------------------- */
let chat=[
 {who:"ai",text:"Hey! I'm KronAI 👑 Ask me about heroes, counters, builds, draft picks, lanes, or basic macro. This is a prototype brain for now."}
];
function coach(){
 return `<div class="wrap">
  <div class="sectionHead" style="margin-top:8px"><div><h2>KronAI Coach</h2><p>The chat works locally with prototype MLBB answers.</p></div></div>
  <div class="coachCard">
   <div class="coachHead"><div class="bot">👑</div><div><b style="font-size:15px">KronAI Coach</b><div style="color:var(--muted);font-size:10px;margin-top:3px">Prototype • future API/AI backend goes here</div></div></div>
   <div class="chat" id="chat">${chat.map(m=>`<div class="msg ${m.who==="user"?"user":"ai"}"><div class="bubble">${esc(m.text)}</div></div>`).join("")}</div>
   <div class="filters" style="margin-top:9px">${["What counters Fanny?","Best Gold Lane pick?","How do I draft?","What should I build?"].map(q=>`<button class="pill" data-coach-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
   <div class="chatInput"><input id="coachInput" placeholder="Ask KronAI anything about MLBB..."><button class="send" id="sendCoach">Send</button></div>
  </div>
 </div>`;
}
function coachReply(q){
 const x=q.toLowerCase();
 const mentioned=heroes.find(h=>x.includes(h.name.toLowerCase()));
 if(x.includes("counter")||x.includes("counters")){
   const h=mentioned;
   if(h){
    const cs=(curatedCounters[h.name]||suggestByRole(h,"counter")).slice(0,4);
    return `For ${h.name}, my prototype recommends ${cs.join(", ")}. The exact answer depends on patch, lane and the enemy's build.`;
   }
   return "Tell me the hero you want to counter and I’ll check the prototype matchup data.";
 }
 if(x.includes("build")||x.includes("item")){
  if(mentioned){
   const d=heroDetails[mentioned.name]||genericDetails(mentioned);
   return `Prototype build for ${mentioned.name}: ${d.build.join(" → ")}. Adapt boots and defense to the enemy damage/control.`;
  }
  return "Give me a hero name and I can show its prototype item path.";
 }
 if(x.includes("gold")){
  const picks=heroes.filter(h=>h.role==="Marksman"&&(h.tier==="S+"||h.tier==="S")).sort((a,b)=>TIERS.indexOf(a.tier)-TIERS.indexOf(b.tier)).slice(0,3);
  return `For Gold Lane, the prototype priority list is ${picks.map(h=>h.name).join(", ")}.`;
 }
 if(x.includes("draft")||x.includes("pick")||x.includes("ban")){
  return "Draft rule: secure a strong flex/priority hero early, cover missing roles, then keep your strongest counter-pick for the final rotation. KronAI's Draft tab can test picks.";
 }
 if(x.includes("rotation")||x.includes("rotate")){
  return "Basic macro: shove the wave before leaving, track the enemy Jungler, then move first to Turtle/Lord. Don't rotate blindly when your lane wave is crashing.";
 }
 if(x.includes("hello")||x.includes("hi")||x.includes("yo"))return"Yo 😎 KronAI online. Ask me about a hero, draft, build, counter or macro.";
 return "I can help with heroes, counters, builds, draft, lanes and basic MLBB macro. Ask something like “What counters Fanny?” or “Best Gold Lane pick?”";
}
function sendCoach(text){
 const q=text.trim();if(!q)return;
 chat.push({who:"user",text:q},{who:"ai",text:coachReply(q)});
 render();
 setTimeout(()=>{const c=document.getElementById("chat");if(c)c.scrollTop=c.scrollHeight},0);
}

/* -------------------- MORE / EASTER EGG -------------------- */
function moreDrawer(){
 return `<div class="drawerBack" data-close="drawer"><aside class="drawer" onclick="event.stopPropagation()">
 <button class="close" data-close="drawer">✕</button>
 <div style="padding-right:40px"><h2>KronAI</h2><div class="sub">Prototype controls</div></div>
 <button class="menuItem" data-nav="home">🏠 Home</button>
 <button class="menuItem" data-nav="heroes">⚔️ Heroes</button>
 <button class="menuItem" data-nav="draft">♜ Draft Assistant</button>
 <button class="menuItem" data-nav="matchup">🔄 Counter Lab</button>
 <button class="menuItem" data-nav="coach">🤖 Coach</button>
 <button class="menuItem" data-secret>🥚 Something suspicious...</button>
 <div class="tips" style="margin-top:20px">Next architecture target: hero data → draft engine → game-state model → vision → live coaching.</div>
 </aside></div>`;
}
function showEaster(){
 easter=true;drawer=false;render();
}
function easterView(){
 return `<div class="easter"><div class="easterBox"><div class="big">👑</div><h2>KRONAI SECRET MODE</h2><p>You found the prototype's hidden egg.</p><p><b>Coach advice:</b> Never chase a 1 HP enemy through three bushes while your Lord is available. 😭</p><button class="btn primary" data-secret-close>Return to KronAI</button></div></div>`;
}

/* -------------------- RENDER -------------------- */
function render(){
 let content=view==="home"?home():view==="heroes"?heroesView():view==="draft"?draft():view==="matchup"?matchup():coach();
 app.innerHTML=`<div class="app">
  <header class="top">
   <button class="logo" data-nav="home" style="border:0;background:none;padding:0;text-align:left">
    <div class="logoMark">K</div><div><div class="logoTitle">KronAI</div><div class="logoSub">YOUR MLBB AI COACH</div></div>
   </button>
   <div class="search"><span>⌕</span><input id="globalSearch" value="${esc(search)}" placeholder="Search heroes..."></div>
   <div class="status"><span class="dot"></span> Prototype</div>
   <button class="iconBtn" data-open-drawer>☰</button>
  </header>
  ${content}
  <div class="footer">KronAI • MLBB AI Coach Prototype • Stats and recommendations are demo data.</div>
  <nav class="bottom">
   ${bottom("⌂","Home","home")} ${bottom("⚔","Heroes","heroes")} ${bottom("🛒","Builds","heroes")}
   ${bottom("♜","Draft","draft")} ${bottom("▦","More","more")}
  </nav>
 </div>
 ${selectedHero?profile():""}${draftPicker?picker():""}${drawer?moreDrawer():""}${easter?easterView():""}`;
 bind();
}
function bottom(icon,label,target){
 const active=(view===target||((target==="heroes")&&view==="heroes"))?"on":"";
 return `<button class="${active}" data-nav="${target}" data-label="${label}"><span class="bi">${icon}</span>${label}</button>`;
}

function bind(){
 document.querySelectorAll("[data-nav]").forEach(el=>el.addEventListener("click",()=>nav(el.getAttribute("data-nav"))));
 document.querySelectorAll("[data-action=hero]").forEach(el=>el.addEventListener("click",()=>{
  selectedHero=el.getAttribute("data-name");profileTab="Skills";render();
 }));
 document.querySelectorAll("[data-tier]").forEach(el=>el.addEventListener("click",()=>{tierFilter=el.getAttribute("data-tier");render()}));
 document.querySelectorAll("[data-role]").forEach(el=>el.addEventListener("click",()=>{roleFilter=el.getAttribute("data-role");render()}));
 document.querySelectorAll("[data-lane]").forEach(el=>el.addEventListener("click",()=>{laneFilter=el.getAttribute("data-lane");render()}));
 document.querySelectorAll("[data-profile-tab]").forEach(el=>el.addEventListener("click",()=>{profileTab=el.getAttribute("data-profile-tab");render()}));
 document.querySelectorAll("[data-close=modal]").forEach(el=>el.addEventListener("click",()=>{selectedHero=null;render()}));
 document.querySelectorAll("[data-close=picker]").forEach(el=>el.addEventListener("click",()=>{draftPicker=null;render()}));
 document.querySelectorAll("[data-close=drawer]").forEach(el=>el.addEventListener("click",()=>{drawer=false;render()}));
 document.querySelectorAll("[data-open-drawer]").forEach(el=>el.addEventListener("click",()=>{drawer=true;render()}));
 document.querySelectorAll("[data-draft-open]").forEach(el=>el.addEventListener("click",()=>openPicker(el.getAttribute("data-draft-open"))));
 document.querySelectorAll("[data-pick-hero]").forEach(el=>el.addEventListener("click",()=>pickDraftHero(el.getAttribute("data-pick-hero"))));
 document.querySelectorAll("[data-draft-rec]").forEach(el=>el.addEventListener("click",()=>{
  const name=el.getAttribute("data-draft-rec");
  const empty=myPicks.findIndex(x=>!x);
  if(empty>=0){myPicks[empty]=name;toast(name+" added to your draft");render()}
 }));
 document.querySelectorAll("[data-coach-q]").forEach(el=>el.addEventListener("click",()=>sendCoach(el.getAttribute("data-coach-q"))));
 document.querySelectorAll("[data-secret]").forEach(el=>el.addEventListener("click",showEaster));
 document.querySelectorAll("[data-secret-close]").forEach(el=>el.addEventListener("click",()=>{easter=false;render()}));

 const gs=document.getElementById("globalSearch");
 if(gs)gs.addEventListener("input",e=>{search=e.target.value;if(view!=="heroes"){view="heroes"}renderKeepFocus("globalSearch")});
 const hs=document.getElementById("heroSearch");
 if(hs)hs.addEventListener("input",e=>{search=e.target.value;renderKeepFocus("heroSearch")});
 const ds=document.getElementById("draftSearch");
 if(ds)ds.addEventListener("input",e=>{draftSearch=e.target.value;renderKeepFocus("draftSearch")});
 const ms=document.getElementById("matchA");
 if(ms)ms.addEventListener("change",e=>{matchA=e.target.value;render()});
 const mb=document.getElementById("matchB");
 if(mb)mb.addEventListener("change",e=>{matchB=e.target.value;render()});
 const input=document.getElementById("coachInput");
 const send=document.getElementById("sendCoach");
 if(input&&send){
  send.addEventListener("click",()=>sendCoach(input.value));
  input.addEventListener("keydown",e=>{if(e.key==="Enter")sendCoach(input.value)})
 }
}
function renderKeepFocus(id){
 const v=document.getElementById(id)?.value||"";
 render();
 const el=document.getElementById(id);
 if(el){el.focus();el.setSelectionRange(v.length,v.length)}
}
function pickDraftHero(name){
 if(!draftPicker)return;
 const [kind,type,index]=draftPicker.split(":");
 const arr=type==="pick"?(kind==="your"?myPicks:enemyPicks):(kind==="your"?myBans:enemyBans);
 arr[+index]=name;
 draftPicker=null;render();toast(name+" locked in");
}

/* Secret shortcut: tap logo 5x */
let logoTaps=0,logoTimer=null;
document.addEventListener("click",e=>{
 if(e.target.closest(".logo")){
  logoTaps++;clearTimeout(logoTimer);logoTimer=setTimeout(()=>logoTaps=0,900);
  if(logoTaps>=5){logoTaps=0;showEaster()}
 }
});
render();
})();
</script>
</body>
</html>
