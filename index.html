<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #050812;
    color: #f5f7ff;
}

header {
    text-align: center;
    padding: 35px 15px 25px;
    background: linear-gradient(180deg,#11182d,#080c18);
    border-bottom: 1px solid #202942;
}

.logo {
    font-size: 42px;
    font-weight: 800;
}

.logo span {
    color: #806cff;
}

.subtitle {
    color: #9ba5c4;
    margin-top: 5px;
    font-size: 17px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px 50px;
}

.card {
    background: #101625;
    border: 1px solid #222b42;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
}

.lane-grid {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 10px;
}

.lane-btn {
    padding: 16px 8px;
    border: 1px solid #303b59;
    background: #151d30;
    color: white;
    border-radius: 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.lane-btn:hover {
    transform: translateY(-2px);
    border-color: #806cff;
    background: #1b2440;
}

.lane-btn.active {
    background: linear-gradient(135deg,#694cff,#9b5cff);
    border-color: #a996ff;
}

.search {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #303a55;
    background: #080d19;
    color: white;
    font-size: 16px;
    margin-bottom: 15px;
}

.hero-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
    gap: 12px;
}

.hero {
    padding: 17px;
    border-radius: 15px;
    background: #0b1120;
    border: 1px solid #26314b;
    cursor: pointer;
    transition: .2s;
}

.hero:hover {
    transform: translateY(-3px);
    border-color: #806cff;
}

.hero-name {
    font-weight: bold;
    font-size: 17px;
}

.hero-role {
    color: #929dbb;
    font-size: 13px;
    margin-top: 5px;
}

.hero-tier {
    margin-top: 8px;
    color: #a98cff;
    font-size: 12px;
}

.result {
    display: none;
}

.result.show {
    display: block;
}

.build-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 15px;
}

.info-box {
    background: #080e1c;
    border: 1px solid #252f48;
    border-radius: 15px;
    padding: 18px;
}

.info-box h3 {
    margin-top: 0;
    color: #9d8cff;
}

.item {
    padding: 8px 0;
    border-bottom: 1px solid #1d263a;
}

.item:last-child {
    border-bottom: none;
}

.tip {
    color: #aeb7cf;
    line-height: 1.6;
}

footer {
    text-align: center;
    color: #68728e;
    padding: 25px;
}

@media(max-width:700px) {
    .lane-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .logo {
        font-size: 34px;
    }
}
</style>

/* =========================================================
   APP LOGIC
========================================================= */

let currentLane = "";

function selectLane(lane,button){

    currentLane = lane;

    document.querySelectorAll(".lane-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    document.getElementById("heroSection").style.display = "block";

    document.getElementById("laneTitle").innerText =
        lane + " Lane Heroes";

    document.getElementById("search").value = "";

    document.getElementById("result").classList.remove("show");

    renderHeroes();

    window.scrollTo({
        top: document.getElementById("heroSection").offsetTop - 15,
        behavior:"smooth"
    });
}


function renderHeroes(){

    const grid = document.getElementById("heroGrid");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const filtered = heroes.filter(hero =>
        hero.lane === currentLane &&
        hero.name.toLowerCase().includes(search)
    );

    grid.innerHTML = "";

    if(filtered.length === 0){

        grid.innerHTML =
            "<p style='color:#8994b0'>No heroes found.</p>";

        return;
    }

    filtered.forEach(hero => {

        const card = document.createElement("div");

        card.className = "hero";

        card.onclick = () =>
            showHero(hero);

        card.innerHTML = `
            <div class="hero-name">${hero.name}</div>
            <div class="hero-role">${hero.role}</div>
            <div class="hero-tier">Tier ${hero.tier}</div>
        `;

        grid.appendChild(card);
    });
}


function showHero(hero){

    const recommendation =
        special[hero.name] ||
        templates[hero.lane];

    document.getElementById("resultTitle").innerText =
        "⚡ " + hero.name;

    document.getElementById("build").innerHTML =
        recommendation.build
        .map(item => `<div class="item">• ${item}</div>`)
        .join("");

    document.getElementById("emblem").innerHTML =
        recommendation.emblem;

    document.getElementById("spell").innerHTML =
        recommendation.spell;

    document.getElementById("playstyle").innerText =
        recommendation.playstyle;

    document.getElementById("result")
        .classList.add("show");

    document.getElementById("result")
        .scrollIntoView({
            behavior:"smooth",
            block:"start"
        });
}
