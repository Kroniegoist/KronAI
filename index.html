<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KronAI | MLBB AI Coach</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #070a12;
        color: white;
        min-height: 100vh;
    }

    header {
        padding: 25px 20px;
        text-align: center;
        background: linear-gradient(135deg, #10172b, #090b14);
        border-bottom: 1px solid #242b45;
    }

    .logo {
        font-size: 34px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    .logo span {
        color: #7c5cff;
    }

    .subtitle {
        color: #9da5bd;
        margin-top: 7px;
    }

    .container {
        width: 92%;
        max-width: 900px;
        margin: 25px auto;
    }

    .panel {
        background: #101522;
        border: 1px solid #252d46;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 20px;
    }

    .panel h2 {
        margin-bottom: 15px;
    }

    input,
    select {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        margin-bottom: 15px;
        background: #080c17;
        border: 1px solid #303955;
        border-radius: 10px;
        color: white;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #7657ff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.9;
    }

    .hero-title {
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .role {
        color: #aeb6ce;
        margin-bottom: 18px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
    }

    .card {
        background: #0b101c;
        border: 1px solid #293149;
        border-radius: 14px;
        padding: 16px;
    }

    .card h3 {
        margin-bottom: 10px;
        font-size: 17px;
    }

    .card p {
        color: #c4c9d8;
        line-height: 1.5; 
    }

    .item {
        display: inline-block;
        background: #191f32;
        border: 1px solid #343d5a;
        padding: 7px 10px;
        border-radius: 8px;
        margin: 4px 3px 0 0;
        font-size: 14px;
    }

    .difficulty {
        font-weight: bold;
    }

    .easy {
        color: #6ee7a0;
    }

    .medium {
        color: #ffd166;
    }

    .hard {
        color: #ff7777;
    }

    .status {
        text-align: center;
        color: #777f98;
        margin-top: 20px;
        font-size: 13px;
    }

    .empty {
        text-align: center;
        color: #8d96ad;
        padding: 20px;
    }

    @media (max-width: 650px) {
        .grid {
            grid-template-columns: 1fr;
        }

        .logo {
            font-size: 29px;
        }

        .hero-title {
            font-size: 26px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="logo">⚡ Kron<span>AI</span></div>
    <div class="subtitle">MLBB Strategy Assistant</div>
</header>

<div class="container">

    <!-- HERO SELECTOR -->
    <div class="panel">

        <h2>🦸 Select Your Hero</h2>

        <input
            type="text"
            id="search"
            placeholder="Search hero..."
            oninput="searchHero()"

        <select id="heroSelect" onchange="showHero()">
            <option value="">Choose a hero...</option>

    </div>


    <!-- HERO RESULT -->
    <div id="result">

        <div class="panel empty">
            Choose a hero above to activate KronAI.

    </div>


    <div class="status">
        KronAI V0.2 • Prototype Recommendation Engine

</div>

// Fill hero dropdown

const select = document.getElementById("heroSelect");

Object.keys(heroes).sort().forEach(hero => {

    const option = document.createElement("option");

    option.value = hero;
    option.textContent = hero;

    select.appendChild(option);

});


// Show selected hero
