<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08060f">
<title>👑 KronAI • MLBB AI Coach</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#eef0ff;
  background:#08060f;
  font-synthesis:none;
  text-rendering:optimizeLegibility;
  --bg:#08060f;
  --panel:#100c1b;
  --panel2:#151025;
  --line:#29213b;
  --text:#eef0ff;
  --muted:#9790b1;
  --accent:#9a7bff;
  --accent2:#65b7ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 70% -10%,#25124d 0%,transparent 35%),
    radial-gradient(circle at -10% 35%,#101a44 0%,transparent 24%),
    var(--bg);
  color:var(--text);
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app-shell{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:18px;
  padding:14px 20px;
  background:rgba(8,6,15,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.brand-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:175px;
}

.brand-mark{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:linear-gradient(135deg,#7c5cff,#39a9ff);
  box-shadow:0 10px 35px rgba(116,80,255,.25);
}

.brand-name{
  font-weight:900;
  font-size:19px;
  letter-spacing:.2px;
}

.brand-sub{
  font-size:9px;
  color:#8d85a8;
  letter-spacing:2px;
  font-weight:800;
}

.top-search{
  flex:1;
  max-width:640px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:9px;
  background:#0f0b18;
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px 13px;
  color:#7e7696;
}

.top-search input,
.input-box input{
  background:transparent;
  border:0;
  outline:0;
  color:var(--text);
  width:100%;
}

.patch-chip{
  font-size:12px;
  color:#c0b9d0;
  background:#120e1f;
  border:1px solid #2c2441;
  padding:8px 11px;
  border-radius:999px;
  white-space:nowrap;
}

.main-nav{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:12px 20px;
  border-bottom:1px solid rgba(255,255,255,.05);
  background:rgba(10,7,17,.78);
}

.nav-btn{
  border:1px solid transparent;
  background:transparent;
  color:#9e97b4;
  padding:9px 12px;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
}

.nav-btn:hover{
  background:#120e1f;
  color:#dcd6f3;
}

.nav-btn.active{
  background:#1a1230;
  color:#fff;
  border-color:#3a2b5b;
}

.content{
  max-width:1400px;
  margin:auto;
  padding:26px 20px 50px;
}

.page-heading{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:18px;
}

.heading-icon{
  width:42px;
  height:42px;
  border-radius:14px;
  background:linear-gradient(135deg,#1b1230,#0d172f);
  border:1px solid #33264e;
  display:grid;
  place-items:center;
  color:#bda6ff;
}

.page-heading h1{
  margin:0;
  font-size:28px;
}

.page-heading p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:13px;
}

.control-row{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin:18px 0;
}

.control-group{
  flex:1;
  min-width:300px;
}

.control-label{
  display:block;
  color:#887f9e;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.4px;
  font-weight:800;
  margin-bottom:7px;
}

.segmented{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.seg{
  background:#0e0a17;
  border:1px solid #28203a;
  color:#a39bb3;
  border-radius:10px;
  padding:9px 12px;
}

.seg.active{
  background:linear-gradient(135deg,#6f4bdf,#2779be);
  color:#fff;
  border-color:#8064de;
  box-shadow:0 5px 20px rgba(107,74,220,.2);
}

.rank-note{
  display:flex;
  align-items:flex-start;
  gap:8px;
  background:#0c0a13;
  border:1px dashed #302842;
  color:#8e87a2;
  padding:11px 13px;
  border-radius:12px;
  font-size:12px;
  line-height:1.45;
  margin-bottom:22px;
}

.tier-section{
  margin-top:30px;
}

.tier-heading{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.tier-heading h2{
  margin:0;
  font-size:17px;
}

.tier-heading p{
  margin:2px 0 0;
  color:#7e7695;
  font-size:12px;
}

.tier-count{
  margin-left:auto;
  min-width:30px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:#120e1f;
  color:#9b91ae;
  border:1px solid #2a223a;
  font-size:12px;
}

.tier-pill,
.mini-tier{
  display:inline-grid;
  place-items:center;
  font-weight:900;
  border-radius:9px;
  border:1px solid transparent;
}

.tier-pill{
  min-width:43px;
  height:36px;
}

.mini-tier{
  font-size:11px;
  min-width:27px;
  height:23px;
  padding:0 6px;
}

.tier-splus{
  background:#7a4eea22;
  border-color:#7a4eea88;
  color:#c8b3ff;
}

.tier-s{
  background:#376cf222;
  border-color:#376cf288;
  color:#a7c3ff;
}

.tier-a{
  background:#1aa36d22;
  border-color:#1aa36d88;
  color:#83e7bb;
}

.tier-b{
  background:#d9531222;
  border-color:#d9531288;
  color:#ffd887;
}

.tier-c{
  background:#c06b3222;
  border-color:#c06b3288;
  color:#ffb484;
}

.tier-f{
  background:#d84e5c22;
  border-color:#d84e5c88;
  color:#ff9aa5;
}

.hero-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:12px;
}

.hero-grid.small-grid{
  margin-top:18px;
}

.hero-card{
  display:flex;
  gap:11px;
  text-align:left;
  background:linear-gradient(180deg,#120e1e,#0d0a15);
  border:1px solid #2b233c;
  border-radius:15px;
  padding:9px;
  color:var(--text);
  min-height:102px;
  transition:.2s;
  box-shadow:0 8px 28px rgba(0,0,0,.1);
}

.hero-card:hover{
  transform:translateY(-2px);
  border-color:#4a3a68;
  box-shadow:0 15px 40px rgba(0,0,0,.23);
}

.hero-portrait{
  position:relative;
  overflow:hidden;
  flex:0 0 74px;
  height:84px;
  border-radius:12px;
  background:
    radial-gradient(circle at 30% 25%,hsl(var(--hue) 90% 75% / .26),transparent 32%),
    linear-gradient(135deg,hsl(var(--hue) 72% 19%),#0c0a15 75%);
  border:1px solid rgba(255,255,255,.08);
  display:grid;
  place-items:center;
}

.hero-portrait-big{
  width:112px;
  height:132px;
  flex-basis:112px;
}

.portrait-glow{
  position:absolute;
  inset:auto 0 0 0;
  height:48%;
  background:linear-gradient(0deg,hsl(var(--hue) 80% 55% / .22),transparent);
}

.portrait-initials{
  font-weight:950;
  font-size:28px;
  letter-spacing:-1px;
  position:relative;
  text-shadow:0 4px 22px rgba(0,0,0,.5);
}

.portrait-initials.large{
  font-size:38px;
}

.role-dot{
  position:absolute;
  right:5px;
  top:5px;
  padding:3px 5px;
  border-radius:999px;
  background:rgba(0,0,0,.35);
  font-size:9px;
  font-weight:900;
}

.hero-card-body{
  min-width:0;
  flex:1;
  padding-top:1px;
}

.hero-title-row{
  display:flex;
  align-items:center;
  gap:7px;
}

.hero-title-row strong{
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.hero-role{
  color:#8e86a2;
  font-size:10px;
  margin-top:3px;
  min-height:31px;
}

.stats-row{
  display:flex;
  gap:9px;
  margin-top:5px;
  color:#777089;
  font-size:10px;
}

.stats-row b{
  color:#ddd7ef;
  font-weight:800;
}

.empty-card{
  padding:20px;
  border:1px dashed #302943;
  border-radius:12px;
  color:#827b94;
  background:#0d0a14;
}

.hero-profile{
  background:linear-gradient(180deg,#110d1c,#0b0811);
  border:1px solid #2d243e;
  border-radius:18px;
  padding:18px;
}

.back-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:transparent;
  border:0;
  color:#9d94b1;
  padding:7px 3px;
  margin-bottom:10px;
}

.profile-head{
  display:flex;
  gap:16px;
  align-items:center;
}

.profile-main{
  flex:1;
}

.profile-name-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.profile-name-row h2{
  font-size:28px;
  margin:0;
}

.profile-role{
  color:#8f87a3;
  margin:4px 0 12px;
}

.profile-stats{
  display:flex;
  gap:22px;
}

.profile-stats div{
  display:flex;
  flex-direction:column;
}

.profile-stats b{
  font-size:17px;
}

.profile-stats span{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#726b82;
  margin-top:1px;
}

.profile-tabs{
  display:flex;
  gap:18px;
  margin:20px 0 15px;
  padding-bottom:8px;
  border-bottom:1px solid #242036;
  color:#706980;
  font-size:12px;
}

.profile-tabs .selected{
  color:#e9e3ff;
  font-weight:900;
}

.profile-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.info-panel{
  background:#0f0b18;
  border:1px solid #29213a;
  border-radius:14px;
  padding:14px;
}

.info-panel h3{
  margin:0 0 10px;
  font-size:14px;
}

.skill-list{
  display:grid;
  gap:8px;
}

.skill-row{
  display:flex;
  gap:9px;
  padding:9px;
  border-radius:10px;
  background:#120e1c;
}

.skill-key{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  border-radius:7px;
  background:#211733;
  color:#c6b5ff;
  font-size:11px;
  font-weight:900;
}

.skill-row b{
  font-size:12px;
}

.skill-row p{
  margin:3px 0 0;
  color:#817993;
  font-size:11px;
  line-height:1.4;
}

.items{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.item-chip,
.counter-chip{
  padding:8px 9px;
  border-radius:9px;
  background:#151023;
  border:1px solid #2d2641;
  color:#d8d1e8;
  font-size:11px;
}

.item-chip span{
  color:#8b82a0;
  margin-right:5px;
}

.build-meta{
  color:#938ba6;
  font-size:11px;
  line-height:1.6;
  margin-top:12px;
}

.build-meta b{
  color:#ddd7eb;
}

.why{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#171022;
  color:#a39ab8;
  font-size:11px;
  line-height:1.5;
}

.counter-grid{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.list-stack{
  display:grid;
  gap:8px;
}

.list-row{
  width:100%;
  display:grid;
  grid-template-columns:54px 150px 1fr 25px;
  gap:10px;
  align-items:center;
  background:#0f0b18;
  border:1px solid #29213a;
  border-radius:12px;
  color:#ddd6ec;
  padding:11px 12px;
  text-align:left;
}

.list-row:hover{
  border-color:#463760;
}

.list-row span{
  font-size:11px;
  color:#847b97;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.hero-name-inline{
  font-weight:900;
  color:#efeaff!important;
}

.counter-row{
  grid-template-columns:150px 1fr 1fr 25px;
}

.coach-grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:14px;
}

.coach-panel,
.coach-result{
  background:#0f0b18;
  border:1px solid #2c233e;
  border-radius:18px;
  padding:17px;
}

.panel-kicker{
  font-size:10px;
  letter-spacing:1.5px;
  color:#776d8c;
  font-weight:900;
}

.coach-panel h2{
  font-size:17px;
  margin:5px 0 10px;
}

.mt{
  margin-top:20px;
}

.input-box{
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid #2a213b;
  background:#0b0812;
  border-radius:11px;
  padding:10px 12px;
  color:#7e7591;
}

.coach-title{
  display:flex;
  align-items:center;
  gap:10px;
}

.ai-orb{
  width:38px;
  height:38px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#744cf3,#318bd0);
}

.coach-title b{
  display:block;
}

.coach-title span{
  display:block;
  color:#777089;
  font-size:11px;
  margin-top:2px;
}

.recommend-hero{
  display:flex;
  gap:14px;
  align-items:center;
  margin:22px 0;
}

.recommend-hero small{
  font-size:9px;
  letter-spacing:1.3px;
  color:#756b89;
  font-weight:900;
}

.recommend-hero h2{
  margin:4px 0 2px;
  font-size:25px;
}

.recommend-hero p{
  margin:0 0 8px;
  color:#8e86a1;
  font-size:12px;
}

.coach-box{
  background:#120d1c;
  border:1px solid #2b233d;
  border-radius:13px;
  padding:12px;
  margin-top:10px;
}

.coach-box b{
  font-size:12px;
}

.coach-box p{
  margin:5px 0 10px;
  color:#8d84a2;
  font-size:11px;
  line-height:1.45;
}

.primary-btn{
  border:1px solid #6d56c6;
  background:linear-gradient(135deg,#6041c5,#2879b6);
  color:#fff;
  border-radius:9px;
  padding:8px 11px;
  font-weight:800;
  font-size:11px;
}

.draft-side{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.draft-side button{
  border:1px solid #2a213a;
  background:#0f0b18;
  color:#9188a4;
  border-radius:10px;
  padding:9px 12px;
}

.draft-side button.active{
  background:#1c1430;
  color:#fff;
  border-color:#4a3772;
}

.draft-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.draft-slot{
  background:#0f0b18;
  border:1px solid #2a213a;
  border-radius:12px;
  padding:12px;
}

.slot-lane{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#706780;
  margin-bottom:7px;
}

.draft-slot button{
  width:100%;
  background:#141021;
  border:1px dashed #352a4b;
  border-radius:9px;
  padding:13px 8px;
  color:#dcd5eb;
}

.draft-analysis{
  display:flex;
  gap:10px;
  margin:14px 0;
  padding:13px;
  border-radius:13px;
  background:#100d19;
  border:1px solid #2b233b;
  color:#a49ab5;
}

.draft-analysis p{
  margin:3px 0 0;
  font-size:11px;
  color:#7c738f;
}

.footer{
  display:flex;
  justify-content:center;
  gap:24px;
  flex-wrap:wrap;
  color:#665f79;
  font-size:10px;
  padding:28px 20px;
  border-top:1px solid rgba(255,255,255,.05);
}

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(3,2,7,.78);
  backdrop-filter:blur(8px);
  display:grid;
  place-items:center;
  padding:20px;
}

.modal{
  width:min(1000px,96vw);
  max-height:92vh;
  overflow:auto;
  position:relative;
}

.modal-close{
  position:fixed;
  margin-left:min(460px,45vw);
  margin-top:2px;
  width:35px;
  height:35px;
  border-radius:10px;
  border:1px solid #3b2e55;
  background:#110d1b;
  color:#d8d1e8;
  z-index:3;
}

@media(max-width:900px){
  .topbar{
    flex-wrap:wrap;
  }

  .top-search{
    order:3;
    max-width:none;
    flex-basis:100%;
  }

  .patch-chip{
    font-size:10px;
  }

  .coach-grid{
    grid-template-columns:1fr;
  }

  .profile-grid{
    grid-template-columns:1fr;
  }

  .draft-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .list-row{
    grid-template-columns:54px 120px 1fr 20px;
  }

  .counter-row{
    grid-template-columns:120px 1fr 1fr 20px;
  }
}

@media(max-width:620px){
  .content{
    padding:18px 12px 35px;
  }

  .main-nav{
    padding:10px 12px;
  }

  .topbar{
    padding:11px 12px;
  }

  .brand-wrap{
    min-width:auto;
  }

  .patch-chip{
    display:none;
  }

  .hero-grid{
    grid-template-columns:1fr;
  }

  .profile-head{
    align-items:flex-start;
  }

  .profile-name-row h2{
    font-size:22px;
  }

  .draft-grid{
    grid-template-columns:1fr;
  }

  .list-row,
  .counter-row{
    grid-template-columns:48px 1fr 18px;
  }

  .list-row>span:nth-child(3){
    display:none;
  }

  .counter-row .hero-name-inline{
    grid-column:1/3;
  }

  .counter-row>span:nth-child(2){
    grid-column:1/3;
  }

  .counter-row>span:nth-child(4){
    grid-column:3;
  }

  .footer{
    gap:10px;
    flex-direction:column;
    align-items:center;
  }
}
</style>
</head>

<div id="root"></div>

function keyFor(name) {
  return name.replace(/[^a-zA-Z0-9]/g, '');
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function modeledRates(name, tier, wr) {
  const verified = live[keyFor(name)];

  if (verified) {
    return {
      pickRate: verified[0],
      banRate: verified[1]
    };
  }

  const tierBase = {
    S: 1.25,
    A: 0.9,
    B: 0.65,
    C: 0.38,
    F: 0.18,
    'S+': 1.55
  }[tier] || 0.4;

  const pick = clamp(
    tierBase + ((wr - 49.5) * 0.12),
    0.04,
    3.4
  );

  const banBase = {
    S: 8,
    A: 3,
    B: 1.5,
    C: 0.8,
    F: 0.35,
    'S+': 14
  }[tier] || 1;

  const ban = clamp(
    banBase + Math.max(0, wr - 52) * 1.6,
    0.02,
    61
  );

  return {
    pickRate: Number(pick.toFixed(2)),
    banRate: Number(ban.toFixed(2))
  };
}

function skillPack(name) {
  return [
    {
      key: 'P',
      name: 'Passive',
      desc: `Core passive interaction for ${name}, used to define the hero's main combat loop.`
    },
    {
      key: '1',
      name: 'Skill 1',
      desc: 'Primary ability for trading, wave control or setup.'
    },
    {
      key: '2',
      name: 'Skill 2',
      desc: 'Secondary ability used for mobility, control or damage depending on the matchup.'
    },
    {
      key: 'ULT',
      name: 'Ultimate',
      desc: 'Signature teamfight or finishing ability. Check cooldown and enemy responses before committing.'
    }
  ];
}

function modelledStatsFor(name, tier, wr) {
  return modeledRates(name, tier, wr);
}

const heroes = roster.map(([name, role, tier, wr], index) => {
  const lanes =
    laneMap[name] ||
    [roleShort[role.split(',')[0]] || 'Mid'];

  const rate = modelledStatsFor(name, tier, wr);

  const stats = {};

  Object.entries(rankMultiplier).forEach(([rank, multiplier]) => {
    stats[rank] = {
      winRate: Number(
        clamp(
          wr * multiplier.wr,
          40,
          62
        ).toFixed(2)
      ),

      pickRate: Number(
        clamp(
          rate.pickRate * multiplier.pick,
          0.01,
          5
        ).toFixed(2)
      ),

      banRate: Number(
        clamp(
          rate.banRate * multiplier.ban,
          0.01,
          65
        ).toFixed(2)
      )
    };
  });

  return {
    id: index + 1,
    name,
    role,
    tier,
    winRate: wr,
    lanes,
    roleShort:
      roleShort[role.split(',')[0]] || 'MID',
    hue:
      hueMap[role.split(',')[0]] || 220,
    initials: name
      .split(/\s+/)
      .map(x => x[0])
      .slice(0, 2)
      .join('')
      .toUpperCase(),
    stats,
    skills: skillPack(name)
  };
});

function DraftView({ openHero }) {

    useState('your');

  const [slots, setSlots] =
    useState({
      EXP: null,
      Jungle: null,
      Mid: null,
      Gold: null,
      Roam: null
    });

  const lanes = [
    'EXP',
    'Jungle',
    'Mid',
    'Gold',
    'Roam'
  ];

  function pickHero(lane) {
    const laneHeroes =
      heroes.filter(hero =>
        hero.lanes.includes(lane)
      );

    if (!laneHeroes.length) return;

    const hero =
      laneHeroes[
        Math.floor(
          Math.random() *
          laneHeroes.length
        )
      ];

    setSlots(current => ({
      ...current,
      [lane]: hero
    }));
  }

  return (
    <section>
      <PageHeading
        icon="🎯"
        title="Draft Board"
        subtitle="Prototype 5-role draft workspace."

      <div className="draft-side">
        <button

              ? 'active'
              : ''
          }
          onClick={() =>
            setSide('your')
          }

          Your Team
        </button>

        <button
          className={
            side === 'enemy'
              ? 'active'
              : ''
          }
          onClick={() =>
            setSide('enemy')
          }
        >
          Enemy Team
        </button>
      </div>

      <div className="draft-grid">
        {lanes.map(lane => (
          <div
            className="draft-slot"
            key={lane}
          >
            <div className="slot-lane">
              {lane}
            </div>

            <button
              onClick={() =>
                pickHero(lane)
              }
            >
              {slots[lane]
                ? slots[lane].name
                : 'Pick Hero'}
            </button>
          </div>
        ))}
      </div>

      <div className="draft-analysis">
        🧪

        <div>
          <b>Quick read</b>

          <p>
            Next layer: real ban
            recommendations, synergy
            scores and matchup-specific

        {heroes.slice(0, 24).map(hero => (

            stats={hero.stats['All Ranks']}
            onOpen={() =>
              openHero(hero)
            }
          />
        ))}

    </section>
  );
