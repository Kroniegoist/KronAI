<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#060a12">
<title>KronAI — MLBB Draft &amp; Meta Prototype</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root{
  --bg:#060a12;
  --panel:#0d141f;
  --panel2:#111b2a;
  --line:#1c2a3d;
  --text:#eaf2ff;
  --muted:#7c8aa0;
  --accent:#2be8a8;
  --accent2:#4fc3ff;
  font-family:"Segoe UI",Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--text); }
body{
  background:
    radial-gradient(circle at 85% -10%, #0d3a35 0%, transparent 40%),
    radial-gradient(circle at -10% 30%, #10233f 0%, transparent 35%),
    var(--bg);
}
button,input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
input{ font-size:16px; } /* prevents iOS auto-zoom on focus */
::-webkit-scrollbar{ height:8px; width:8px; }
::-webkit-scrollbar-thumb{ background:#233247; border-radius:8px; }

.shell{ min-height:100vh; padding-bottom:30px; }

.hdr{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px;
  padding:12px 16px;
  background:rgba(6,10,18,.9);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:36px; height:36px; display:grid; place-items:center;
  clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#04140f; font-weight:900; font-size:16px;
}
.brand-txt b{ display:block; font-size:16px; letter-spacing:.3px; }
.brand-txt span{ display:block; font-size:9px; color:var(--muted); letter-spacing:1.6px; }
.hdr-search{
  flex:1; max-width:420px; margin-left:auto;
  display:flex; align-items:center; gap:8px;
  background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  padding:8px 12px; color:var(--muted);
}
.hdr-search input{ background:transparent; border:0; outline:0; color:var(--text); width:100%; }
.badge{
  font-size:10px; color:#9fb4c9; background:var(--panel2); border:1px solid var(--line);
  padding:6px 10px; border-radius:999px; white-space:nowrap;
}

.tabbar{
  display:flex; gap:6px; overflow-x:auto; padding:10px 12px;
  border-bottom:1px solid var(--line); background:rgba(8,13,22,.7);
}
.tab-btn{
  border:1px solid transparent; background:var(--panel); color:var(--muted);
  padding:10px 14px; border-radius:10px; white-space:nowrap; min-height:40px;
  display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600;
}
.tab-btn.on{ background:linear-gradient(135deg,#0f4a3d,#0e3450); color:#fff; border-color:#1c6a55; }

.wrap{ max-width:1300px; margin:0 auto; padding:18px 14px 40px; }

.notice{
  display:flex; gap:8px; align-items:flex-start;
  background:#0c1a16; border:1px dashed #1f4d3f; color:#8fc9b3;
  padding:10px 12px; border-radius:10px; font-size:12px; line-height:1.5; margin-bottom:18px;
}

.section-head{ display:flex; align-items:center; gap:10px; margin:22px 0 12px; }
.section-head h2{ margin:0; font-size:17px; }
.section-head p{ margin:2px 0 0; font-size:12px; color:var(--muted); }
.count-chip{
  margin-left:auto; min-width:26px; height:26px; padding:0 8px; display:grid; place-items:center;
  background:var(--panel2); border:1px solid var(--line); border-radius:8px; font-size:11px; color:var(--muted);
}

.pill-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.pill{ background:var(--panel); border:1px solid var(--line); color:var(--muted); border-radius:9px; padding:8px 12px; font-size:12px; min-height:38px; }
.pill.on{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#04140f; font-weight:700; border-color:transparent; }

.hero-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:10px; }

.hcard{
  display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;
  background:linear-gradient(180deg,#0d1420,#0a0e17);
  border:1px solid var(--line); border-radius:14px; padding:12px 8px;
}
.hcard:active{ border-color:var(--accent); }
.hex{
  width:64px; height:64px;
  clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
  display:grid; place-items:center; font-weight:900; font-size:18px; color:#04140f;
  background:linear-gradient(150deg, var(--role-hex,#2be8a8), #0a0e17 85%);
}
.hex.big{ width:96px; height:96px; font-size:26px; }
.hname{ font-size:12.5px; font-weight:700; line-height:1.2; }
.role-tag{ font-size:9px; color:var(--muted); letter-spacing:.5px; }
.tier-chip{
  font-size:10px; font-weight:900; padding:2px 8px; border-radius:999px;
  border:1px solid var(--tier-c,#2be8a8); color:var(--tier-c,#2be8a8); background:color-mix(in srgb, var(--tier-c,#2be8a8) 14%, transparent);
}
.mini-stats{ display:flex; gap:7px; font-size:9.5px; color:var(--muted); }
.mini-stats b{ color:var(--text); }

.empty-note{ padding:18px; border:1px dashed var(--line); border-radius:12px; color:var(--muted); text-align:center; font-size:13px; }

/* Modal / profile */
.modal-bg{
  position:fixed; inset:0; z-index:80; background:rgba(3,5,9,.82); backdrop-filter:blur(6px);
  display:flex; align-items:flex-end; justify-content:center; padding:0;
}
@media(min-width:760px){ .modal-bg{ align-items:center; padding:20px; } }
.modal{
  width:100%; max-width:760px; max-height:92vh; overflow-y:auto;
  background:linear-gradient(180deg,#0d1420,#080b12);
  border:1px solid var(--line); border-radius:20px 20px 0 0; padding:20px; position:relative;
}
@media(min-width:760px){ .modal{ border-radius:20px; } }
.modal-close{
  position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:9px;
  background:var(--panel2); border:1px solid var(--line); color:var(--text);
}
.profile-top{ display:flex; gap:16px; align-items:center; margin-bottom:14px; }
.profile-info h2{ margin:0 0 4px; font-size:22px; }
.profile-info .sub{ font-size:12px; color:var(--muted); }
.stat-row{ display:flex; gap:18px; margin-top:10px; }
.stat-row div{ display:flex; flex-direction:column; }
.stat-row b{ font-size:16px; }
.stat-row span{ font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }

.profile-tabs{ display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); margin:14px 0; }
.ptab{ background:transparent; border:0; color:var(--muted); padding:10px 12px; font-size:12.5px; font-weight:700; border-bottom:2px solid transparent; }
.ptab.on{ color:var(--accent); border-color:var(--accent); }

.skill-strip{ display:flex; gap:8px; margin-bottom:12px; }
.skill-btn{
  flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 4px;
  display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; color:var(--muted); min-height:56px;
}
.skill-btn b{ font-size:13px; color:var(--text); }
.skill-btn.on{ border-color:var(--accent); background:#0d241d; color:var(--accent); }
.skill-desc{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:13px; line-height:1.55; color:#c8d6e5; }
.skill-desc b{ color:var(--text); }

.chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{ background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:7px 10px; font-size:11.5px; }
.chip span{ color:var(--muted); margin-right:5px; }
.meta-line{ font-size:12px; color:var(--muted); line-height:1.7; margin-top:10px; }
.meta-line b{ color:var(--text); }
.why-box{ background:#0d1420; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12px; color:#aebccb; line-height:1.5; margin-top:10px; }

.matchup-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media(max-width:520px){ .matchup-grid{ grid-template-columns:1fr; } }
.matchup-col h4{ margin:0 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }

/* Draft board */
.draft-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media(max-width:760px){ .draft-grid{ grid-template-columns:1fr; } }
.team-col{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; }
.team-col.enemy{ border-color:#4a1c2a; }
.team-col h3{ margin:0 0 10px; font-size:14px; display:flex; align-items:center; gap:8px; }
.dot{ width:9px; height:9px; border-radius:50%; }
.dot.your{ background:var(--accent); }
.dot.enemy{ background:#ff5d7a; }
.ban-row{ display:flex; gap:6px; margin-bottom:12px; }
.ban-slot{
  flex:1; aspect-ratio:1; border-radius:10px; border:1px dashed var(--line);
  background:var(--panel2); display:grid; place-items:center; font-size:9px; color:var(--muted); text-align:center; padding:2px;
  overflow:hidden;
}
.ban-slot.filled{ border-style:solid; border-color:#ff5d7a; color:#ffd7de; font-weight:700; }
.pick-slot{
  width:100%; display:flex; align-items:center; gap:10px; background:var(--panel2);
  border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin-bottom:8px; text-align:left; min-height:52px;
}
.pick-slot .lane-lbl{ font-size:9px; color:var(--muted); text-transform:uppercase; width:44px; flex-shrink:0; }
.pick-slot .pname{ font-weight:700; font-size:13px; }
.pick-slot .placeholder{ color:var(--muted); font-size:12.5px; }

.suggest-box{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:16px; }
.suggest-box h3{ margin:0 0 4px; font-size:14px; }
.suggest-box p{ margin:0 0 12px; font-size:11.5px; color:var(--muted); }
.suggest-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
.suggest-card{
  flex:0 0 auto; width:96px; background:var(--panel2); border:1px solid var(--line); border-radius:12px;
  padding:10px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px;
}
.suggest-card .why{ font-size:9px; color:var(--muted); line-height:1.3; }

/* Picker overlay */
.picker-bg{ position:fixed; inset:0; z-index:90; background:rgba(3,5,9,.88); display:flex; flex-direction:column; }
.picker-hdr{ display:flex; align-items:center; gap:10px; padding:14px; border-bottom:1px solid var(--line); }
.picker-hdr input{ flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; outline:0; }
.picker-close{ background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:9px 12px; }
.picker-clear{ margin:10px 14px 0; background:#2a1420; border:1px solid #4a1c2a; color:#ff9fb2; border-radius:10px; padding:10px; text-align:center; font-size:13px; }
.picker-list{ flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
.picker-item{
  display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--panel2);
  border:1px solid var(--line); border-radius:12px; padding:10px; font-size:11.5px;
}
.picker-item.disabled{ opacity:.28; pointer-events:none; }

.footer{ text-align:center; color:var(--muted); font-size:11px; padding:26px 10px 10px; }
</style>
</head>

/* ============ BUILD HEROES OBJECTS ============ */
const heroes = roster.map(([name, role, tier], idx) => {
  const lanes = laneMap[name] || ['Mid'];
  const pRole = primaryRole(role);
  const stats = statsFor(name, tier);
  return {
    id: idx+1, name, role, tier, lanes, primaryRole: pRole,
    roleHex: ROLE_COLOR[pRole] || '#2be8a8',
    initials: name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(),
    stats
  };
});
const heroByName = {};
heroes.forEach(h => { heroByName[h.name] = h; });

function getCounters(hero){
  const curated = curatedCounters[hero.name];
  if (curated) return curated.map(n=>heroByName[n]).filter(Boolean);
  const strongRoles = ROLE_STRONG_AGAINST[hero.primaryRole] || [];
  return heroes
    .filter(h => h.name !== hero.name && strongRoles.includes(h.primaryRole))
    .sort((a,b) => TIER_SCORE[b.tier]-TIER_SCORE[a.tier])
    .slice(0,4);
}
function getSynergy(hero){
  const curated = curatedSynergy[hero.name];
  if (curated) return curated.map(n=>heroByName[n]).filter(Boolean);
  const synRoles = ROLE_SYNERGY[hero.primaryRole] || [];
  return heroes
    .filter(h => h.name !== hero.name && synRoles.includes(h.primaryRole))
    .sort((a,b) => TIER_SCORE[b.tier]-TIER_SCORE[a.tier])
    .slice(0,4);
}
function getBuild(hero){
  return specialBuilds[hero.name] || genericBuild[hero.lanes[0]] || genericBuild.Mid;
}

function HeroPicker({ lane, excluded, onPick, onClear, onClose, canClear }){
  const [q, setQ] = useState('');

    let list = lane ? heroes.filter(h=>h.lanes.includes(lane)) : heroes;

  return (
    <div className="picker-bg">
      <div className="picker-hdr">
        <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder={lane ? ('Search ' + lane + ' heroes...') : 'Search any hero to ban...'} />

/* ============ DRAFT BOARD PAGE ============ */
function DraftBoard({ openHero }){
  const [yourPicks, setYourPicks] = useState({ EXP:null, Jungle:null, Mid:null, Gold:null, Roam:null });
  const [enemyPicks, setEnemyPicks] = useState({ EXP:null, Jungle:null, Mid:null, Gold:null, Roam:null });
  const [yourBans, setYourBans] = useState([null,null,null,null,null]);
  const [enemyBans, setEnemyBans] = useState([null,null,null,null,null]);
  const [picker, setPicker] = useState(null); // {kind:'pick'|'ban', side:'your'|'enemy', lane?, index?}

  const usedNames = useMemo(()=>{
    const s = new Set();
    Object.values(yourPicks).forEach(h=>h&&s.add(h.name));
    Object.values(enemyPicks).forEach(h=>h&&s.add(h.name));
    yourBans.forEach(h=>h&&s.add(h.name));
    enemyBans.forEach(h=>h&&s.add(h.name));
    return s;
  }, [yourPicks, enemyPicks, yourBans, enemyBans]);

  function handlePick(hero){
    if (!picker) return;
    if (picker.kind==='pick'){
      const setter = picker.side==='your' ? setYourPicks : setEnemyPicks;
      setter(cur=>({ ...cur, [picker.lane]: hero }));
    } else {
      const setter = picker.side==='your' ? setYourBans : setEnemyBans;
      setter(cur=> cur.map((b,i)=> i===picker.index ? hero : b));
    }
    setPicker(null);
  }
  function handleClear(){
    if (!picker) return;
    if (picker.kind==='pick'){
      const setter = picker.side==='your' ? setYourPicks : setEnemyPicks;
      setter(cur=>({ ...cur, [picker.lane]: null }));
    } else {
      const setter = picker.side==='your' ? setYourBans : setEnemyBans;
      setter(cur=> cur.map((b,i)=> i===picker.index ? null : b));
    }
    setPicker(null);
  }

  function counterScore(candidate, enemyHero){
    const curated = curatedCounters[enemyHero.name];
    if (curated && curated.includes(candidate.name)) return 3;
    const strong = ROLE_STRONG_AGAINST[candidate.primaryRole] || [];
    return strong.includes(enemyHero.primaryRole) ? 1.4 : 0;
  }
  function suggestForLane(lane){
    if (yourPicks[lane]) return [];
    const candidates = heroes.filter(h=> h.lanes.includes(lane) && !usedNames.has(h.name));
    const enemyList = Object.values(enemyPicks).filter(Boolean);
    const scored = candidates.map(c=>{
      let score = TIER_SCORE[c.tier]*0.5;
      enemyList.forEach(e=>{ score += counterScore(c,e); });
      return { hero:c, score };
    });
    scored.sort((a,b)=>b.score-a.score);
    return scored.slice(0,3);
  }
  const banSuggestions = useMemo(()=>{
    const candidates = heroes.filter(h=>!usedNames.has(h.name));
    return candidates
      .map(h=>({ hero:h, score: TIER_SCORE[h.tier]*10 + h.stats.banRate }))
      .sort((a,b)=>b.score-a.score)
      .slice(0,5);
  }, [usedNames]);

  function TeamCol({ side, picks, bans, label }){
    return (
      <div className={'team-col' + (side==='enemy' ? ' enemy' : '')}>
        <h3><span className={'dot ' + side}></span>{label}</h3>
        <div className="ban-row">
          {bans.map((h,i)=>(
            <button key={i} className={'ban-slot' + (h?' filled':'')} onClick={()=>setPicker({kind:'ban', side, index:i})}>
              {h ? h.initials : 'BAN'}
            </button>
          ))}
        </div>
        {LANES.map(lane=>{
          const h = picks[lane];
          return (
            <button key={lane} className="pick-slot" onClick={()=>setPicker({kind:'pick', side, lane})}>
              <span className="lane-lbl">{lane}</span>
              {h ? (<><HeroHex hero={h} /><span className="pname">{h.name}</span></>) : <span className="placeholder">Tap to pick hero</span>}
            </button>
          );
        })}
      </div>
    );
  }

  return (
    <div>
      <div className="notice">ℹ️ Suggestions use a simplified role-advantage + curated-matchup heuristic — a starting point for drafting, not a guaranteed win condition.</div>
      <div className="draft-grid">
        <TeamCol side="your" picks={yourPicks} bans={yourBans} label="Your Team" />
        <TeamCol side="enemy" picks={enemyPicks} bans={enemyBans} label="Enemy Team" />
      </div>

      <div className="suggest-box">
        <h3>Suggested Picks (counters enemy team)</h3>
        <p>Based on lanes you haven't filled yet, weighed against enemy picks so far.</p>
        {LANES.filter(l=>!yourPicks[l]).map(lane=>{
          const sugg = suggestForLane(lane);
          if (!sugg.length) return null;
          return (
            <div key={lane} style={{marginBottom:12}}>
              <div style={{fontSize:11, color:'var(--muted)', marginBottom:6, textTransform:'uppercase'}}>{lane} lane</div>
              <div className="suggest-row">
                {sugg.map(s=>(
                  <div className="suggest-card" key={s.hero.name} onClick={()=>openHero(s.hero)}>
                    <HeroHex hero={s.hero} />
                    <div style={{fontSize:11, fontWeight:700}}>{s.hero.name}</div>
                    <TierChip tier={s.hero.tier} />
                    <div className="why">score {s.score.toFixed(1)}</div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
        {LANES.every(l=>yourPicks[l]) && <div className="empty-note">All your lanes are filled.</div>}
      </div>

      <div className="suggest-box">
        <h3>Suggested Bans</h3>
        <p>Highest-threat heroes still available, based on tier and ban rate.</p>
        <div className="suggest-row">
          {banSuggestions.map(s=>(
            <div className="suggest-card" key={s.hero.name} onClick={()=>openHero(s.hero)}>
              <HeroHex hero={s.hero} />
              <div style={{fontSize:11, fontWeight:700}}>{s.hero.name}</div>
              <TierChip tier={s.hero.tier} />
            </div>
          ))}
        </div>
      </div>

      {picker && (
        <HeroPicker
          lane={picker.kind==='pick' ? picker.lane : null}
          excluded={usedNames}
          onPick={handlePick}
          onClear={handleClear}
          onClose={()=>setPicker(null)}
          canClear={
            picker.kind==='pick'
              ? !!(picker.side==='your' ? yourPicks[picker.lane] : enemyPicks[picker.lane])
              : !!(picker.side==='your' ? yourBans[picker.index] : enemyBans[picker.index])
          }
        />
      )}
    </div>
  );
}

      </header>

      <nav className="tabbar">
